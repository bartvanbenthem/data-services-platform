# What the portal's backend may do in the platform cluster: manage
# PostgresClusters, create and change Projects, and read the CNPG Clusters, pods, pod logs, events and namespaces it
# shows on the detail page, and keep the kubeconfigs of locations (bottom). It never touches CNPG objects directly -- every
# write goes through the PostgresCluster API (and so through the XRD schema).
apiVersion: v1
kind: Namespace
metadata:
  name: backstage
  labels:
    # Backstage's own database (database.yaml) lives here, outside any
    # Project; exempt from the optional require-project policy.
    platform.cncp.nl/allow-unmanaged-postgres: "true"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backstage
  namespace: backstage
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: backstage-cnpg-portal
rules:
  - apiGroups: [cnpg.cncp.nl]
    resources: [postgresclusters]
    verbs: [get, list, watch, create, update, patch, delete]
  # Projects (namespace + Prometheus + Grafana): list them for the project
  # picker, create new ones and change their settings. No delete: removing a project removes every
  # database in it, which stays a kubectl decision (see deletionProtection).
  - apiGroups: [platform.cncp.nl]
    resources: [projects]
    verbs: [get, list, watch, create, patch]
  - apiGroups: [postgresql.cnpg.io]
    resources: [clusters]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [namespaces, pods, events]
    verbs: [get, list, watch]
  # The Logs tab: stdout of the cluster's pods (the backend checks the pod's cnpg.io/cluster label).
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: backstage-cnpg-portal
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: backstage-cnpg-portal
subjects:
  - kind: ServiceAccount
    name: backstage
    namespace: backstage
---
# Locations: one Secret per Kubernetes cluster the platform can use, holding
# its kubeconfig (key "kubeconfig", the layout Crossplane's provider-kubernetes
# and provider-helm read). Secret access is limited to this namespace.
apiVersion: v1
kind: Namespace
metadata:
  name: cnpg-locations
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: backstage-cnpg-locations
  namespace: cnpg-locations
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, create, update, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backstage-cnpg-locations
  namespace: cnpg-locations
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: backstage-cnpg-locations
subjects:
  - kind: ServiceAccount
    name: backstage
    namespace: backstage
