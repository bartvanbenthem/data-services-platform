                    - alert: CNPGClusterLogicalReplicationErrors
                      annotations:
                        summary: CNPG Cluster logical replication errors detected
                        description: |-
                          CloudNativePG Cluster's "{{ $namespace }}/{{ $name }}" "{{"{{"}} .subname {{"}}"}}" subscription has experienced {{"{{"}} $value {{"}}"}} errors.

                          This includes both apply errors (during normal replication) and sync errors (during initial table sync). Errors indicate data consistency issues that need immediate attention to prevent data divergence.
                        runbook_url: https://github.com/cloudnative-pg/charts/blob/main/charts/cluster/docs/runbooks/CNPGClusterLogicalReplicationErrors.md
                      expr: |
                        label_replace(max by (namespace, job, subname) (increase(cnpg_pg_stat_subscription_apply_error_count[5m]) + increase(cnpg_pg_stat_subscription_sync_error_count[5m])), "cluster", "$1", "job", ".+/(.+)") > 0
                      for: 1m
                      labels:
                        severity: warning
                        namespace: {{ $namespace }}
                        cnpg_cluster: {{ $name }}
                    {{- end }}
                    {{- if not (has "CNPGClusterLogicalReplicationLaggingCritical" $excludeRules) }}
                    - alert: CNPGClusterLogicalReplicationLaggingCritical
                      annotations:
                        summary: CNPG Cluster critical logical replication lag
                        description: |-
                          CloudNativePG Cluster's "{{ $namespace }}/{{ $name }}" "{{"{{"}} .subname {{"}}"}}" subscription is experiencing critical replication lag!
                          Current lag: {{"{{"}} $value {{"}}"}}s

                          CRITICAL: The subscriber is significantly behind the publisher. Immediate action required. This could lead to significant data inconsistency, disk space exhaustion on publisher, or extended recovery time.
                        runbook_url: https://github.com/cloudnative-pg/charts/blob/main/charts/cluster/docs/runbooks/CNPGClusterLogicalReplicationLagging.md
                      expr: |
                        (
                          # Receipt lag - not receiving WAL data
                          label_replace(max by (namespace, job, subname) (cnpg_pg_stat_subscription_receipt_lag_seconds), "cluster", "$1", "job", ".+/(.+)") > 300
                        ) or (
                          # Apply lag - not applying received data
                          label_replace(max by (namespace, job, subname) (cnpg_pg_stat_subscription_apply_lag_seconds), "cluster", "$1", "job", ".+/(.+)") > 300
                        ) or (
                          # LSN distance - large amount of pending data
                          label_replace(max by (namespace, job, subname) (cnpg_pg_stat_subscription_buffered_lag_bytes), "cluster", "$1", "job", ".+/(.+)") / 1024^3 > 4
                        )
                      for: 2m
                      labels:
                        severity: critical
                        namespace: {{ $namespace }}
                        cnpg_cluster: {{ $name }}
                    {{- end }}
                    {{- if not (has "CNPGClusterLogicalReplicationLagging" $excludeRules) }}
                    - alert: CNPGClusterLogicalReplicationLagging
                      annotations:
                        summary: CNPG Cluster logical replication lagging
                        description: |-
                          CloudNativePG Cluster's "{{ $namespace }}/{{ $name }}" "{{"{{"}} .subname {{"}}"}}" subscription is experiencing replication lag.
                          Current lag: {{"{{"}} $value {{"}}"}}s

                          This alert indicates the subscriber is falling behind the publisher. The lag could be receipt lag (not receiving WAL data fast enough due to network issues), apply lag (receiving data but not applying it fast enough due to resource contention), or LSN distance (large amount of pending data to be applied).
                        runbook_url: https://github.com/cloudnative-pg/charts/blob/main/charts/cluster/docs/runbooks/CNPGClusterLogicalReplicationLagging.md
                      expr: |
                        (
                          # Receipt lag - time since last message received
                          label_replace(max by (namespace, job, subname) (cnpg_pg_stat_subscription_receipt_lag_seconds), "cluster", "$1", "job", ".+/(.+)") > 60
                        ) or (
                          # Apply lag - time delay in applying changes
                          label_replace(max by (namespace, job, subname) (cnpg_pg_stat_subscription_apply_lag_seconds), "cluster", "$1", "job", ".+/(.+)") > 60
                        ) or (
                          # LSN distance - bytes pending to be applied
                          label_replace(max by (namespace, job, subname) (cnpg_pg_stat_subscription_buffered_lag_bytes), "cluster", "$1", "job", ".+/(.+)") / 1024^3 > 1
                        )
                      for: 5m
                      labels:
                        severity: warning
                        namespace: {{ $namespace }}
                        cnpg_cluster: {{ $name }}
                    {{- end }}
                    {{- if not (has "CNPGClusterLogicalReplicationStoppedCritical" $excludeRules) }}
                    - alert: CNPGClusterLogicalReplicationStoppedCritical
                      annotations:
                        summary: CNPG Cluster logical replication subscription CRITICAL
                        description: "CloudNativePG Cluster's \"{{ $namespace }}/{{ $name }}\" \"{{"{{"}} .subname {{"}}"}}\" subscription is in a critical state.\n\nCRITICAL: The subscription has been stopped for more than 15 minutes. This will lead to significant data divergence and requires immediate intervention.\n\nStatus: \nDuration: {{"{{"}} $value {{"}}"}}s"
                        runbook_url: https://github.com/cloudnative-pg/charts/blob/main/charts/cluster/docs/runbooks/CNPGClusterLogicalReplicationStopped.md
                      expr: |
                        (
                          # Subscription is explicitly disabled
                          label_replace(max by (namespace, job, subname) (cnpg_pg_stat_subscription_enabled), "cluster", "$1", "job", ".+/(.+)") == 0
                        ) or (
                          # Subscription is enabled but stuck (no worker process with significant lag)
                          label_replace(max by (namespace, job, subname) (cnpg_pg_stat_subscription_enabled), "cluster", "$1", "job", ".+/(.+)") == 1
                          and label_replace(max by (namespace, job, subname) (cnpg_pg_stat_subscription_pid), "cluster", "$1", "job", ".+/(.+)") == 0
                          and label_replace(max by (namespace, job, subname) (cnpg_pg_stat_subscription_buffered_lag_bytes), "cluster", "$1", "job", ".+/(.+)") / 1024^3 > 0.1
                        )
                      for: 15m
                      labels:
                        severity: critical
                        namespace: {{ $namespace }}
                        cnpg_cluster: {{ $name }}
                    {{- end }}
                    {{- if not (has "CNPGClusterLogicalReplicationStopped" $excludeRules) }}
                    - alert: CNPGClusterLogicalReplicationStopped
                      annotations:
                        summary: CNPG Cluster logical replication subscription stopped
                        description: "CloudNativePG Cluster's \"{{ $namespace }}/{{ $name }}\" \"{{"{{"}} .subname {{"}}"}}\" subscription is stopped.\n\nStatus: \n\nThe subscription is not actively replicating data. This could be intentional (disabled) or due to an issue preventing the subscription from working."
                        runbook_url: https://github.com/cloudnative-pg/charts/blob/main/charts/cluster/docs/runbooks/CNPGClusterLogicalReplicationStopped.md
                      expr: |
                        (
                          # Subscription is explicitly disabled
                          label_replace(max by (namespace, job, subname) (cnpg_pg_stat_subscription_enabled), "cluster", "$1", "job", ".+/(.+)") == 0
                        ) or (
                          # Subscription is enabled but stuck (no worker process with significant lag)
                          label_replace(max by (namespace, job, subname) (cnpg_pg_stat_subscription_enabled), "cluster", "$1", "job", ".+/(.+)") == 1
                          and label_replace(max by (namespace, job, subname) (cnpg_pg_stat_subscription_pid), "cluster", "$1", "job", ".+/(.+)") == 0
                          and label_replace(max by (namespace, job, subname) (cnpg_pg_stat_subscription_buffered_lag_bytes), "cluster", "$1", "job", ".+/(.+)") / 1024^3 > 0.1
                        )
                      for: 5m
                      labels:
                        severity: warning
                        namespace: {{ $namespace }}
                        cnpg_cluster: {{ $name }}
                    {{- end }}
                    {{- if not (has "CNPGClusterLowDiskSpaceCritical" $excludeRules) }}
                    - alert: CNPGClusterLowDiskSpaceCritical
                      annotations:
                        summary: CNPG Instance is running out of disk space!
                        description: CloudNativePG Cluster "{{ $namespace }}/{{ $name }}" is running extremely low on disk space. Check attached PVCs!
                        runbook_url: https://github.com/cloudnative-pg/charts/blob/main/charts/cluster/docs/runbooks/CNPGClusterLowDiskSpaceCritical.md
                      expr: |
                        max(max by(persistentvolumeclaim) (1 - kubelet_volume_stats_available_bytes{namespace="{{ $namespace }}", persistentvolumeclaim=~"{{ $name }}-([1-9][0-9]*)$"} / kubelet_volume_stats_capacity_bytes{namespace="{{ $namespace }}", persistentvolumeclaim=~"{{ $name }}-([1-9][0-9]*)$"})) * 100 > 90 OR
                        max(max by(persistentvolumeclaim) (1 - kubelet_volume_stats_available_bytes{namespace="{{ $namespace }}", persistentvolumeclaim=~"{{ $name }}-([1-9][0-9]*)$-wal"} / kubelet_volume_stats_capacity_bytes{namespace="{{ $namespace }}", persistentvolumeclaim=~"{{ $name }}-([1-9][0-9]*)$-wal"})) * 100 > 90 OR
                        max(sum by (namespace,persistentvolumeclaim) (kubelet_volume_stats_used_bytes{namespace="{{ $namespace }}", persistentvolumeclaim=~"{{ $name }}-([1-9][0-9]*)$-tbs.*"})
                            /
                            sum by (namespace,persistentvolumeclaim) (kubelet_volume_stats_capacity_bytes{namespace="{{ $namespace }}", persistentvolumeclaim=~"{{ $name }}-([1-9][0-9]*)$-tbs.*"})
                            *
                            on(namespace, persistentvolumeclaim) group_left(volume)
                            kube_pod_spec_volumes_persistentvolumeclaims_info{pod=~"{{ $name }}-([1-9][0-9]*)$"}
                        ) * 100 > 90
                      for: 5m
                      labels:
                        severity: critical
                        namespace: {{ $namespace }}
                        cnpg_cluster: {{ $name }}
                    {{- end }}
                    {{- if not (has "CNPGClusterLowDiskSpaceWarning" $excludeRules) }}
                    - alert: CNPGClusterLowDiskSpaceWarning
                      annotations:
                        summary: CNPG Instance is running out of disk space.
                        description: CloudNativePG Cluster "{{ $namespace }}/{{ $name }}" is running low on disk space. Check attached PVCs.
                        runbook_url: https://github.com/cloudnative-pg/charts/blob/main/charts/cluster/docs/runbooks/CNPGClusterLowDiskSpaceWarning.md
                      expr: |
                        max(max by(persistentvolumeclaim) (1 - kubelet_volume_stats_available_bytes{namespace="{{ $namespace }}", persistentvolumeclaim=~"{{ $name }}-([1-9][0-9]*)$"} / kubelet_volume_stats_capacity_bytes{namespace="{{ $namespace }}", persistentvolumeclaim=~"{{ $name }}-([1-9][0-9]*)$"})) * 100 > 70 OR
                        max(max by(persistentvolumeclaim) (1 - kubelet_volume_stats_available_bytes{namespace="{{ $namespace }}", persistentvolumeclaim=~"{{ $name }}-([1-9][0-9]*)$-wal"} / kubelet_volume_stats_capacity_bytes{namespace="{{ $namespace }}", persistentvolumeclaim=~"{{ $name }}-([1-9][0-9]*)$-wal"})) * 100 > 70 OR
                        max(sum by (namespace,persistentvolumeclaim) (kubelet_volume_stats_used_bytes{namespace="{{ $namespace }}", persistentvolumeclaim=~"{{ $name }}-([1-9][0-9]*)$-tbs.*"})
                            /
                            sum by (namespace,persistentvolumeclaim) (kubelet_volume_stats_capacity_bytes{namespace="{{ $namespace }}", persistentvolumeclaim=~"{{ $name }}-([1-9][0-9]*)$-tbs.*"})
                            *
                            on(namespace, persistentvolumeclaim) group_left(volume)
                            kube_pod_spec_volumes_persistentvolumeclaims_info{pod=~"{{ $name }}-([1-9][0-9]*)$"}
                        ) * 100 > 70
                      for: 5m
                      labels:
                        severity: warning
                        namespace: {{ $namespace }}
                        cnpg_cluster: {{ $name }}
                    {{- end }}
                    {{- if not (has "CNPGClusterOffline" $excludeRules) }}
                    - alert: CNPGClusterOffline
                      annotations:
                        summary: CNPG Cluster has no running instances!
                        description: |-
                          CloudNativePG Cluster "{{ $namespace }}/{{ $name }}" has no ready instances.

                          Having an offline cluster means your applications will not be able to access the database, leading to
                          potential service disruption and/or data loss.
                        runbook_url: https://github.com/cloudnative-pg/charts/blob/main/charts/cluster/docs/runbooks/CNPGClusterOffline.md
                      expr: |
                        (count(cnpg_collector_up{namespace="{{ $namespace }}",pod=~"{{ $name }}-([1-9][0-9]*)$"}) OR on() vector(0)) == 0
                      for: 5m
                      labels:
                        severity: critical
                        namespace: {{ $namespace }}
                        cnpg_cluster: {{ $name }}
                    {{- end }}
                    {{- if not (has "CNPGClusterPhysicalReplicationLagCritical" $excludeRules) }}
                    - alert: CNPGClusterPhysicalReplicationLagCritical
                      annotations:
                        summary: CNPG Cluster very high physical replication lag
                        description: |-
                          CloudNativePG Cluster "{{ $namespace }}/{{ $name }}" is experiencing a very high physical replication lag of {{"{{"}} $value {{"}}"}}ms.

                          High replication lag indicates network issues, busy instances, slow queries or suboptimal configuration.
                        runbook_url: https://github.com/cloudnative-pg/charts/blob/main/charts/cluster/docs/runbooks/CNPGClusterPhysicalReplicationLag.md
                      expr: |
                        max(cnpg_pg_replication_lag{namespace="{{ $namespace }}",pod=~"{{ $name }}-([1-9][0-9]*)$"}) > 15
                      for: 5m
                      labels:
                        severity: critical
                        namespace: {{ $namespace }}
                        cnpg_cluster: {{ $name }}
                    {{- end }}
                    {{- if not (has "CNPGClusterPhysicalReplicationLagWarning" $excludeRules) }}
                    - alert: CNPGClusterPhysicalReplicationLagWarning
                      annotations:
                        summary: CNPG Cluster high physical replication lag
                        description: |-
                          CloudNativePG Cluster "{{ $namespace }}/{{ $name }}" is experiencing a high physical replication lag of {{"{{"}} $value {{"}}"}}ms.

                          High replication lag indicates network issues, busy instances, slow queries or suboptimal configuration.
                        runbook_url: https://github.com/cloudnative-pg/charts/blob/main/charts/cluster/docs/runbooks/CNPGClusterPhysicalReplicationLag.md
                      expr: |
                        max(cnpg_pg_replication_lag{namespace="{{ $namespace }}",pod=~"{{ $name }}-([1-9][0-9]*)$"}) > 1
                      for: 5m
                      labels:
                        severity: warning
                        namespace: {{ $namespace }}
                        cnpg_cluster: {{ $name }}
                    {{- end }}
                    {{- if not (has "CNPGClusterZoneSpreadWarning" $excludeRules) }}
                    - alert: CNPGClusterZoneSpreadWarning
                      annotations:
                        summary: CNPG Cluster instances in the same zone.
                        description: |-
                          CloudNativePG Cluster "{{ $namespace }}/{{ $name }}" has instances in the same availability zone.

                          A disaster in one availability zone will lead to a potential service disruption and/or data loss.
                        runbook_url: https://github.com/cloudnative-pg/charts/blob/main/charts/cluster/docs/runbooks/CNPGClusterZoneSpreadWarning.md
                      expr: |
                        3 > count(count by (label_topology_kubernetes_io_zone) (kube_pod_info{namespace="{{ $namespace }}", pod=~"{{ $name }}-([1-9][0-9]*)$"} * on(node,instance) group_left(label_topology_kubernetes_io_zone) kube_node_labels)) < 3
                      for: 5m
                      labels:
                        severity: warning
                        namespace: {{ $namespace }}
                        cnpg_cluster: {{ $name }}
                    {{- end }}
            {{- end }}

            {{- /* ================= Grafana dashboard ================= */}}
            {{- if $dashEnabled }}
            ---
            apiVersion: grafana.integreatly.org/v1beta1
            kind: GrafanaDashboard
            metadata:
              name: {{ $name }}-cnpg
              namespace: {{ $namespace }}
              annotations:
                {{ setResourceNameAnnotation "dashboard" }}
                gotemplating.fn.crossplane.io/ready: {{ if index $observed "dashboard" }}"True"{{ else }}"False"{{ end }}
              labels:
                {{- range $k, $v := $labels }}
                {{ $k }}: {{ $v | quote }}
                {{- end }}
            spec:
              instanceSelector:
                matchLabels:
                  {{- range $k, $v := $dashSelector }}
                  {{ $k }}: {{ $v | quote }}
                  {{- end }}
              allowCrossNamespaceImport: {{ dig "grafanaDashboard" "allowCrossNamespaceImport" false $mon }}
              folder: {{ dig "grafanaDashboard" "folder" "CloudNativePG" $mon | quote }}
              # Unique per cluster (the upstream JSON hardcodes "cloudnative-pg",
              # which made every cluster's dashboard collide in one Grafana).
              uid: {{ $dashUid }}
              resyncPeriod: 10m
              datasources:
                - inputName: DS_PROMETHEUS
                  datasourceName: {{ dig "grafanaDashboard" "datasourceName" "prometheus" $mon | quote }}
              # CloudNativePG's official Grafana dashboard (Apache-2.0), same
              # JSON as cn-paas-operator-poc's internal/cnpg/dashboards, with
              # title/uid and the namespace/cluster variables preset to this
              # cluster by hack/generate.py.
