NPG Cluster","hide":0,"includeAll":false,"label":"Cluster","multi":false,"name":"cluster","options":[],"query":{"query":"cnpg_collector_up{namespace=~\"$namespace\"}","refId":"PrometheusVariableQueryEditor-VariableQuery"},"refresh":2,"regex":"/\\bcluster\\b=\"(?<text>[^\"]+)/g","skipUrlSync":false,"sort":1,"type":"query"},{"allValue":"$cluster-([1-9][0-9]*)","current":{{"{}"}},"datasource":{"type":"prometheus","uid":"${DS_PROMETHEUS}"},"definition":"cnpg_collector_up{namespace=~\"$namespace\",pod=~\"$cluster-([1-9][0-9]*)$\"}","description":"Database cluster instances","hide":0,"includeAll":true,"label":"Instances","multi":true,"name":"instances","options":[],"query":{"qryType":4,"query":"cnpg_collector_up{namespace=~\"$namespace\",pod=~\"$cluster-([1-9][0-9]*)$\"}","refId":"PrometheusVariableQueryEditor-VariableQuery"},"refresh":2,"regex":"/pod=\"(?<text>[^\"]+)/g","skipUrlSync":false,"sort":1,"type":"query"}]},"time":{"from":"now-7d","to":"now"},"timepicker":{"nowDelay":""},"timezone":"","title":"CloudNativePG / {{ $namespace }} / {{ $name }}","uid":"{{ $dashUid }}","version":2,"weekStart":""}
            {{- end }}

            {{- /* ================= XR status ================= */}}
            {{- $osObs := index $observed "objectstore" }}
            {{- $window := dict }}
            {{- if $osObs }}{{ $window = dig "resource" "status" "serverRecoveryWindow" $name (dict) $osObs }}{{ end }}
            {{- $phase := dig "phase" "Provisioning" $cstatus }}
            {{- $ready := int (dig "readyInstances" 0 $cstatus) }}
            {{- $msg := printf "Waiting for CNPG Cluster %s (phase: %s, %d/%d instances ready)" $name $phase $ready $instances }}
            {{- if $clusterReady }}{{ $msg = printf "CNPG Cluster %s is ready (%d/%d instances)" $name $ready $instances }}{{ end }}
            ---
            apiVersion: cnpg.cncp.nl/v1alpha1
            kind: PostgresCluster
            status:
              ready: {{ $clusterReady }}
              phase: {{ $phase | quote }}
              instances: {{ int (dig "instances" 0 $cstatus) }}
              readyInstances: {{ $ready }}
              currentPrimary: {{ dig "currentPrimary" "" $cstatus | quote }}
              image: {{ dig "image" "" $cstatus | quote }}
              message: {{ $msg | quote }}
              endpoints:
                readWrite: {{ printf "%s-rw.%s.svc" $name $namespace }}
                readOnly: {{ printf "%s-ro.%s.svc" $name $namespace }}
                read: {{ printf "%s-r.%s.svc" $name $namespace }}
                {{- if $poolerEnabled }}
                pooler: {{ printf "%s-pooler-rw.%s.svc" $name $namespace }}
                {{- if dig "readOnly" false $pooler }}
                poolerReadOnly: {{ printf "%s-pooler-ro.%s.svc" $name $namespace }}
                {{- end }}
                {{- end }}
              secrets:
                app: {{ $name }}-app
                {{- if $spec.enableSuperuserAccess }}
                superuser: {{ $name }}-superuser
                {{- end }}
              {{- if $backupEnabled }}
              backup:
                lastSuccessfulBackup: {{ dig "lastSuccessfulBackupTime" "" $window | quote }}
                firstRecoverabilityPoint: {{ dig "firstRecoverabilityPoint" "" $window | quote }}
              {{- end }}
              {{- if $dashEnabled }}
              monitoring:
                dashboardUid: {{ $dashUid }}
              {{- end }}
            ---
            # Custom condition next to Crossplane's own Ready/Synced (those
            # two types are reserved). Carries CNPG's view of health.
            apiVersion: meta.gotemplating.fn.crossplane.io/v1alpha1
            kind: ClaimConditions
            conditions:
              - type: PostgresReady
                status: {{ if $clusterReady }}"True"{{ else }}"False"{{ end }}
                reason: {{ if $clusterReady }}ClusterHealthy{{ else }}ClusterNotReady{{ end }}
                message: {{ $msg | quote }}
                target: Composite
