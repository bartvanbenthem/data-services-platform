# Cluster-wide settings for every Project (read by apis/project/composition.yaml).
# All keys are optional; without this object Projects get no Grafana ingress
# and expect kube-prometheus-stack in prometheus-operator-system.
apiVersion: apiextensions.crossplane.io/v1beta1
kind: EnvironmentConfig
metadata:
  name: project-defaults
data:
  grafana:
    ingress:
      className: haproxy
      # "{project}" is replaced by the Project name. nip.io resolves to the IP
      # in the name: use your ingress controller's LoadBalancer IP
      # (kubectl get svc -n haproxy-ingress), or a wildcard DNS name.
      hostTemplate: grafana-{project}.203.0.113.10.nip.io
      scheme: http
      # tlsSecretName: wildcard-tls        # Secret in each project namespace
  prometheus:
    # kube-prometheus-stack's kubelet / kube-state-metrics / node-exporter
    # ServiceMonitors, which the CNPG dashboard's CPU/memory panels need.
    clusterMetrics:
      enabled: true
      namespace: prometheus-operator-system
      serviceMonitorLabels:
        release: prometheus-operator
    # The CNPG operator's PodMonitor, for the dashboard's operator panels
    # (ready operator pods, reconcile errors).
    operatorMetrics:
      enabled: true
      namespace: cnpg-system
    # The databases run in the projects' locations: the Prometheus there
    # sends its samples to the project's Prometheus on the control plane,
    # through an Ingress that exposes only /api/v1/write. Without this they
    # keep their metrics (and still evaluate the alerts), but the project's
    # Grafana sees none of them. clusterMetrics and operatorMetrics above
    # describe the locations.
    # remoteWrite:
    #   hostTemplate: prometheus-{project}.203.0.113.10.nip.io
    #   scheme: http                       # https with tlsSecretName
    #   className: haproxy
    #   # tlsSecretName: wildcard-tls
    #   # Restrict who may write, e.g. the locations' egress IPs:
    #   annotations:
    #     haproxy-ingress.github.io/allowlist-source-range: 198.51.100.0/24
  # A COSI backup bucket per Project (Project spec.backup): PostgresClusters
  # with backups but no destinationPath of their own archive there, both
  # sites of a geo-replicated cluster with credentials of their own. Each
  # Project gets its own BucketClass (deletionPolicy: Retain, so deleting a
  # Project keeps its backups) for this driver, and in its namespace the
  # BucketClaim, a BucketAccess per location and the credentials. The access
  # class's driver must hand out S3 keys, and the bucket's endpoint must be
  # reachable from every location.
  # backup:
  #   cosi:
  #     driverName: cloudian-cosi-driver
  #     parameters: {}                     # driver-specific BucketClass parameters
  #     bucketAccessClassName: backups-keys
  #   # Each location checks every few minutes that it reaches the bucket
  #   # (Project status.backup.reachability, shown in the portal): a CronJob
  #   # there writes, reads back and deletes platform-check/<location>. The
  #   # image needs sh and curl >= 7.75 (SigV4); mirror it for air-gapped
  #   # locations.
  #   check:
  #     enabled: true
  #     image: curlimages/curl:8.16.0
  #     schedule: "*/5 * * * *"
