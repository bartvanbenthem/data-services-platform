status:
  atProvider:
    manifest:
      apiVersion: postgresql.cnpg.io/v1
      kind: ScheduledBackup
      metadata:
        name: payments-db-scheduled
        namespace: payments
---
apiVersion: kubernetes.m.crossplane.io/v1alpha1
