# What Crossplane would observe once CNPG has brought payments-db up: a
# healthy Cluster and an ObjectStore with a recovery window. Every other
# composed resource just needs to exist to count as ready.
apiVersion: kubernetes.m.crossplane.io/v1alpha1
kind: Object
metadata:
  name: payments-db-cluster
  namespace: payments
  annotations:
    crossplane.io/composition-resource-name: cluster
status:
  atProvider:
    manifest:
      apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      metadata:
        name: payments-db
        namespace: payments
      status:
        phase: Cluster in healthy state
        instances: 3
        readyInstances: 3
        currentPrimary: payments-db-1
        image: ghcr.io/cloudnative-pg/postgresql:17.11-202610050823-standard-trixie
        conditions:
        - type: Ready
          status: 'True'
          reason: ClusterIsReady
          message: Cluster is Ready
---
apiVersion: kubernetes.m.crossplane.io/v1alpha1
kind: Object
metadata:
  name: payments-db-objectstore
  namespace: payments
  annotations:
    crossplane.io/composition-resource-name: objectstore
status:
  atProvider:
    manifest:
      apiVersion: barmancloud.cnpg.io/v1
      kind: ObjectStore
      metadata:
        name: payments-db-backup
        namespace: payments
      status:
        serverRecoveryWindow:
          payments-db:
            firstRecoverabilityPoint: '2026-10-01T02:00:13Z'
            lastSuccessfulBackupTime: '2026-10-07T02:00:41Z'
---
apiVersion: kubernetes.m.crossplane.io/v1alpha1
kind: Object
metadata:
  name: payments-db-scheduled-backup
  namespace: payments
  annotations:
