# What Crossplane would observe once CNPG has brought payments-db up: a
# healthy Cluster and an ObjectStore with a recovery window. Every other
# composed resource just needs to exist to count as ready.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: payments-db
  namespace: payments
  annotations:
    crossplane.io/composition-resource-name: cluster
status:
  phase: Cluster in healthy state
  instances: 3
  readyInstances: 3
  currentPrimary: payments-db-1
  image: ghcr.io/cloudnative-pg/postgresql:17.11-202610050823-standard-trixie
  conditions:
    - type: Ready
      status: "True"
      reason: ClusterIsReady
      message: Cluster is Ready
---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: payments-db-backup
  namespace: payments
  annotations:
    crossplane.io/composition-resource-name: objectstore
status:
  serverRecoveryWindow:
    payments-db:
      firstRecoverabilityPoint: "2026-10-01T02:00:13Z"
      lastSuccessfulBackupTime: "2026-10-07T02:00:41Z"
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: payments-db-scheduled
  namespace: payments
  annotations:
    crossplane.io/composition-resource-name: scheduled-backup
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: payments-db-payments-audit
  namespace: payments
  annotations:
    crossplane.io/composition-resource-name: database-payments-audit
status:
  applied: true
---
apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: payments-db-pooler-rw
  namespace: payments
  annotations:
    crossplane.io/composition-resource-name: pooler-rw
---
apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: payments-db-pooler-ro
  namespace: payments
  annotations:
    crossplane.io/composition-resource-name: pooler-ro
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: payments-db
  namespace: payments
  annotations:
    crossplane.io/composition-resource-name: podmonitor
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: payments-db-pooler
  namespace: payments
  annotations:
    crossplane.io/composition-resource-name: podmonitor-pooler
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: payments-db-alerts
  namespace: payments
  annotations:
    crossplane.io/composition-resource-name: prometheusrule
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: payments-db-cnpg
  namespace: payments
  annotations:
    crossplane.io/composition-resource-name: dashboard
