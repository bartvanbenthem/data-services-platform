# The sizes (SKUs) a PostgresCluster can pick with spec.size, read by the
# composition, the size admission policy and the portal. install/install.sh
# applies this once; after that the object on the control plane is the
# catalog, edit it there.
#
# Per size:
#   name          what spec.size says; lowercase, never rename one in use
#   displayName   label in the portal
#   description   one line in the portal
#   resources     each PostgreSQL instance's requests/limits (CNPG
#                 resources). Memory request == limit gives PostgreSQL the
#                 memory its settings assume; no CPU limit, so instances
#                 aren't throttled
#   parameters    postgresql.conf, tuned to the memory: shared_buffers ~25%,
#                 effective_cache_size ~75%. spec.postgresql.parameters wins
#                 over these. Values are strings
#   storage       what the portal suggests for a new cluster (size, walSize);
#                 the API leaves volumes to spec.storage/spec.walStorage
#
# Changing a size here resizes every cluster of that size: CNPG restarts the
# instances one by one, the primary last (switchover). Removing one only
# blocks new clusters from picking it; existing ones keep what they run with.
# The portal lists the sizes in this order.
apiVersion: apiextensions.crossplane.io/v1beta1
kind: EnvironmentConfig
metadata:
  name: postgres-sizes
data:
  sizes:
    - name: xs
      displayName: XS
      description: Development and tests
      resources:
        requests: {cpu: 500m, memory: 1Gi}
        limits: {memory: 1Gi}
      parameters:
        max_connections: "100"
        shared_buffers: 256MB
        effective_cache_size: 768MB
        work_mem: 4MB
        maintenance_work_mem: 64MB
      storage:
        size: 10Gi
    - name: s
      displayName: S
      description: Small production workloads
      resources:
        requests: {cpu: "1", memory: 4Gi}
        limits: {memory: 4Gi}
      parameters:
        max_connections: "200"
        shared_buffers: 1GB
        effective_cache_size: 3GB
        work_mem: 8MB
        maintenance_work_mem: 256MB
      storage:
        size: 20Gi
        walSize: 5Gi
    - name: m
      displayName: M
      description: General purpose production
      resources:
        requests: {cpu: "2", memory: 8Gi}
        limits: {memory: 8Gi}
      parameters:
        max_connections: "200"
        shared_buffers: 2GB
        effective_cache_size: 6GB
        work_mem: 16MB
        maintenance_work_mem: 512MB
      storage:
        size: 50Gi
        walSize: 10Gi
    - name: l
      displayName: L
      description: Busy production databases
      resources:
        requests: {cpu: "4", memory: 16Gi}
        limits: {memory: 16Gi}
      parameters:
        max_connections: "300"
        shared_buffers: 4GB
        effective_cache_size: 12GB
        work_mem: 32MB
        maintenance_work_mem: 1GB
      storage:
        size: 100Gi
        walSize: 20Gi
    - name: xl
      displayName: XL
      description: Large, memory-hungry databases
      resources:
        requests: {cpu: "8", memory: 32Gi}
        limits: {memory: 32Gi}
      parameters:
        max_connections: "400"
        shared_buffers: 8GB
        effective_cache_size: 24GB
        work_mem: 64MB
        maintenance_work_mem: 2GB
      storage:
        size: 250Gi
        walSize: 50Gi
