# Source for composition.yaml. hack/generate.py replaces the #@DASHBOARD_JSON@
# and #@ALERT_RULES@ marker lines with ../../src/dashboards/cnpg-cluster.json
# and ../../src/alerts/cnpg-cluster-rules.yaml (escaped for Go templating).
# Edit this file, then run `make generate`; never edit composition.yaml.
#
# Crossplane v2: the namespaced PostgresCluster XR lives in its Project's
# namespace on the control plane, which runs no databases. The CNPG and
# Prometheus Operator objects go to the Project's locations, each wrapped in a
# provider-kubernetes Object; only the GrafanaDashboard is composed directly
# (the project's Grafana runs on the control plane).
#
# Readiness: every composed resource sets gotemplating.fn.crossplane.io/ready
# explicitly (non-managed resources have no generic Ready signal), so the
# XR's own Ready condition means "Cluster healthy + every extra object exists".
#
# Sites: the Project (requested as an extra resource, named after the
# namespace) has a protected location and optionally a recovery location
# (spec.locations). The XR pins them in status.sites on first use, so a
# cluster never moves, and a missing Project never empties the composition.
#
# Members: the "member" template renders what one location runs (Cluster,
# backups, databases, poolers, monitors). The protected site is the member
# with resource-name prefix "", the recovery site (spec.geoReplication) the
# member with prefix "recovery-". The emitter after the template wraps each
# object in a provider-kubernetes Object for the ClusterProviderConfig named
# after the location. .observed.resources is normalised first (an Object's
# status.atProvider.manifest is its live object), so the member template
# reads live status as if the objects were local.
#
# The replica cluster uses CloudNativePG's distributed topology: both members
# list each other in externalClusters (WAL from the Barman Cloud object
# store, one server name per member) and replica.primary names the primary.
# Changing spec.geoReplication.primarySite first demotes the current
# primary, then promotes the other site with the demotion token the old
# primary publishes (promotion: Switchover), or promotes right away
# (Failover). The XR's status.primaryLocation/promotionToken carry that state
# between reconciles. Disabling geoReplication while the primary is in the
# recovery site switches it back first; the replica cluster goes after that.
#
# Backups without backup.destinationPath go to the Project's backup bucket
# (COSI, Project status.backup): every member archives there with the
# credentials the Project unpacked for its location (Secret
# backup-s3-<location> in the project namespace), copied to the location as
# <name>-backup-s3. The bucket is pinned
# in status.backupStore on first use.
#
# Restore (spec.restore, only at creation): the protected site's Cluster
# bootstraps with recovery from another cluster's backup folder, through a
# read-only ObjectStore <name>-restore (no retentionPolicy: nothing is ever
# deleted through it). The restored cluster archives to a folder of its own,
# <name>-<uid[:8]>, so it never writes into the source's folder, not even when
# it takes the name of a deleted cluster. Its replica cluster's folder is
# <that>-<recovery location>.
#
# Sizes (spec.size): the EnvironmentConfig "postgres-sizes" (data.sizes, a
# list of {name, resources, parameters, ...}) says what each size gets: the
# instances' resources and tuned postgresql.conf settings, under the ones
# spec.postgresql.parameters sets. Without spec.size, spec.resources (or
# 500m/1Gi) applies. The result is kept in status.sizing: while the catalog
# can't be read or has dropped the size, the cluster keeps running with that,
# never with the defaults. Changing a size in the catalog resizes every cluster
# of that size (CNPG restarts the instances one by one, the primary last).
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: postgrescluster
  labels:
    cnpg.cncp.nl/api: postgrescluster
spec:
  compositeTypeRef:
    apiVersion: cnpg.cncp.nl/v1alpha1
    kind: PostgresCluster
  mode: Pipeline
  pipeline:
    - step: render
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{- /* ================= member: everything one location runs =================
                 . = dict xr, member (location, topology, prefix, original, instances,
                 sizing, observed, replica), members, distributed. $observed is the member's
                 normalised observed resources, keyed without the member prefix. */}}
            {{- define "member" }}
            {{- $xr := .xr }}
            {{- $spec := $xr.spec }}
            {{- $name := $xr.metadata.name }}
            {{- $namespace := $xr.metadata.namespace }}
            {{- $m := .member }}
            {{- $observed := $m.observed }}

            {{- /* ---- defaults (the API server applies the XRD defaults; these keep `crossplane render` and older objects safe) ---- */}}
            {{- $instances := int $m.instances }}
            {{- $storage := $spec.storage | default (dict) }}
            {{- /* Resolved by the top level from spec.size (or spec.resources). */}}
            {{- $res := $m.sizing.resources }}
            {{- $pg := $spec.postgresql | default (dict) }}
            {{- /* The size's tuned settings, under the ones spec.postgresql sets. */}}
            {{- $params := merge (deepCopy ($pg.parameters | default (dict))) $m.sizing.parameters }}
            {{- $db := $spec.database | default (dict) }}
            {{- $ha := $spec.highAvailability | default (dict) }}
            {{- $syncReplicas := int (dig "synchronousReplicas" 0 $ha) }}
            {{- $pooler := $spec.pooler | default (dict) }}
            {{- $poolerEnabled := dig "enabled" false $pooler }}
            {{- /* The top level resolves the Project's bucket into the member's backup. */}}
            {{- $backup := $m.backup | default ($spec.backup | default (dict)) }}
            {{- $backupEnabled := dig "enabled" false $backup }}
            {{- /* Secret name here -> where to copy it from: "<namespace>/<name>", or the same name in the XR's namespace. */}}
            {{- $copyFrom := $m.copyFrom | default (dict) }}
            {{- $mon := $spec.monitoring | default (dict) }}
            {{- $monEnabled := dig "enabled" true $mon }}
            {{- $monLabels := dig "podMonitorLabels" (dict) $mon }}
            {{- $rulesEnabled := and $monEnabled (dig "prometheusRule" "enabled" true $mon) }}
            {{- $excludeRules := dig "prometheusRule" "excludeRules" (list) $mon }}
            {{- $objectStoreName := printf "%s-backup" $name }}
            {{- /* spec.restore resolved by the top level (original member only):
                 dict store (a backup-like destination), serverName, targetTime. */}}
            {{- $rs := $m.restore | default (dict) }}

            {{- $labels := dict "app.kubernetes.io/managed-by" "crossplane" "app.kubernetes.io/part-of" "cnpg-platform" "cnpg.cncp.nl/postgrescluster" $name }}

            {{- /* ================= CloudNativePG Cluster ================= */}}
            {{- $clusterObs := index $observed "cluster" }}
            {{- $cstatus := dict }}
            {{- if $clusterObs }}{{ $cstatus = dig "resource" "status" (dict) $clusterObs }}{{ end }}
            {{- $clusterReady := false }}
            {{- range (dig "conditions" (list) $cstatus) }}
            {{- if and (eq .type "Ready") (eq .status "True") }}{{ $clusterReady = true }}{{ end }}
            {{- end }}
            ---
            apiVersion: postgresql.cnpg.io/v1
            kind: Cluster
            metadata:
              name: {{ $name }}
              namespace: {{ $namespace }}
              annotations:
                {{ setResourceNameAnnotation "cluster" }}
                gotemplating.fn.crossplane.io/ready: {{ if $clusterReady }}"True"{{ else }}"False"{{ end }}
              labels:
                {{- range $k, $v := $labels }}
                {{ $k }}: {{ $v | quote }}
                {{- end }}
            spec:
              description: {{ printf "PostgresCluster %s/%s (cnpg.cncp.nl)" $namespace $name | quote }}
              instances: {{ $instances }}
              imageCatalogRef:
                apiGroup: postgresql.cnpg.io
                kind: ClusterImageCatalog
                name: {{ $spec.imageCatalog | default "postgresql-standard-trixie" | quote }}
                major: {{ int ($spec.postgresVersion | default 17) }}
              enableSuperuserAccess: {{ $spec.enableSuperuserAccess | default false }}
              primaryUpdateStrategy: {{ dig "primaryUpdateStrategy" "unsupervised" $ha }}
              primaryUpdateMethod: {{ dig "primaryUpdateMethod" "switchover" $ha }}
              # Copied by CNPG onto every object it generates (pods, PVCs,
              # services, secrets): lets Prometheus relabelling and the
              # Backstage Kubernetes plugin find all of them.
              inheritedMetadata:
                labels:
                  cnpg.cncp.nl/postgrescluster: {{ $name | quote }}
                  backstage.io/kubernetes-id: {{ $name | quote }}
              storage:
                size: {{ dig "size" "10Gi" $storage | quote }}
                {{- with $storage.storageClass }}
                storageClass: {{ . | quote }}
                {{- end }}
              {{- with $spec.walStorage }}
              walStorage:
                size: {{ .size | quote }}
                {{- with .storageClass }}
                storageClass: {{ . | quote }}
                {{- end }}
              {{- end }}
              resources:
                requests:
                  cpu: {{ dig "requests" "cpu" "500m" $res | quote }}
                  memory: {{ dig "requests" "memory" "1Gi" $res | quote }}
                limits:
                  {{- with (dig "limits" "cpu" "" $res) }}
                  cpu: {{ . | quote }}
                  {{- end }}
                  memory: {{ dig "limits" "memory" "1Gi" $res | quote }}
              affinity:
                enablePodAntiAffinity: true
                podAntiAffinityType: {{ dig "podAntiAffinityType" "preferred" $ha }}
                topologyKey: kubernetes.io/hostname
              {{- if dig "zoneSpread" true $ha }}
              topologySpreadConstraints:
                - maxSkew: 1
                  topologyKey: topology.kubernetes.io/zone
                  # ScheduleAnyway: single-zone clusters keep working; the
                  # CNPGClusterZoneSpreadWarning alert flags the imbalance.
                  whenUnsatisfiable: ScheduleAnyway
                  labelSelector:
                    matchLabels:
                      cnpg.io/cluster: {{ $name }}
                      cnpg.io/podRole: instance
              {{- end }}
              {{- if or $params $pg.pgHba $pg.sharedPreloadLibraries (gt $syncReplicas 0) }}
              postgresql:
                {{- with $params }}
                parameters:
                  {{- range $k, $v := . }}
                  {{ $k }}: {{ $v | quote }}
                  {{- end }}
                {{- end }}
                {{- with $pg.pgHba }}
                pg_hba:
                  {{- range . }}
                  - {{ . | quote }}
                  {{- end }}
                {{- end }}
                {{- with $pg.sharedPreloadLibraries }}
                shared_preload_libraries:
                  {{- range . }}
                  - {{ . | quote }}
                  {{- end }}
                {{- end }}
                {{- if gt $syncReplicas 0 }}
                synchronous:
                  method: any
                  number: {{ $syncReplicas }}
                  dataDurability: {{ dig "synchronousDataDurability" "preferred" $ha }}
                {{- end }}
              {{- end }}
              bootstrap:
                {{- if $rs }}
                # Point-in-time recovery from another cluster's backups
                # (spec.restore); the application owner's password is reset
                # into the <name>-app Secret.
                recovery:
                  source: restore-source
                  database: {{ dig "name" "app" $db | quote }}
                  owner: {{ dig "owner" "app" $db | quote }}
                  {{- with $rs.targetTime }}
                  recoveryTarget:
                    targetTime: {{ . | quote }}
                  {{- end }}
                {{- else if $m.original }}
                initdb:
                  database: {{ dig "name" "app" $db | quote }}
                  owner: {{ dig "owner" "app" $db | quote }}
                  encoding: {{ dig "encoding" "UTF8" $db | quote }}
                  localeCollate: {{ dig "localeCollate" "C" $db | quote }}
                  localeCType: {{ dig "localeCType" "C" $db | quote }}
                {{- else }}
                # A replica cluster starts from the original member's base
                # backup and WAL archive.
                recovery:
                  source: {{ (first .members).topology }}
                {{- end }}
              {{- if .distributed }}
              # Distributed topology: self/primary decide whether this member
              # is the primary or a replica cluster following source.
              replica:
                self: {{ $m.topology }}
                primary: {{ $m.replica.primary }}
                source: {{ $m.replica.source }}
                {{- with $m.replica.promotionToken }}
                promotionToken: {{ . | quote }}
                {{- end }}
              {{- end }}
              {{- if or .distributed $rs }}
              externalClusters:
                {{- if .distributed }}
                {{- range .members }}
                - name: {{ .topology }}
                  plugin:
                    name: barman-cloud.cloudnative-pg.io
                    parameters:
                      barmanObjectName: {{ $objectStoreName }}
                      serverName: {{ .topology }}
                {{- end }}
                {{- end }}
                {{- with $rs }}
                - name: restore-source
                  plugin:
                    name: barman-cloud.cloudnative-pg.io
                    parameters:
                      barmanObjectName: {{ $name }}-restore
                      serverName: {{ .serverName }}
                {{- end }}
              {{- end }}
              {{- if or $spec.roles $spec.expose }}
              managed:
                {{- with $spec.roles }}
                roles:
                  {{- range . }}
                  - name: {{ .name | quote }}
                    ensure: present
                    login: {{ dig "login" true . }}
                    createdb: {{ dig "createdb" false . }}
                    connectionLimit: {{ int (dig "connectionLimit" -1 .) }}
                    {{- with .inRoles }}
                    inRoles:
                      {{- range . }}
                      - {{ . | quote }}
                      {{- end }}
                    {{- end }}
                    {{- with .passwordSecret }}
                    passwordSecret:
                      name: {{ . | quote }}
                    {{- end }}
                  {{- end }}
                {{- end }}
                {{- with $spec.expose }}
                services:
                  additional:
                    - selectorType: rw
                      serviceTemplate:
                        metadata:
                          name: {{ $name }}-external
                          {{- with .annotations }}
                          annotations:
                            {{- range $k, $v := . }}
                            {{ $k }}: {{ $v | quote }}
                            {{- end }}
                          {{- end }}
                        spec:
                          type: {{ .type | default "LoadBalancer" }}
                          {{- with .loadBalancerSourceRanges }}
                          loadBalancerSourceRanges:
                            {{- range . }}
                            - {{ . | quote }}
                            {{- end }}
                          {{- end }}
                {{- end }}
              {{- end }}
              {{- if $backupEnabled }}
              plugins:
                - name: barman-cloud.cloudnative-pg.io
                  isWALArchiver: true
                  parameters:
                    barmanObjectName: {{ $objectStoreName }}
                    {{- if ne $m.topology $name }}
                    # Its own folder in the shared object store (a replica
                    # cluster, or a restored cluster).
                    serverName: {{ $m.topology }}
                    {{- end }}
              {{- end }}

            {{- /* ================= Backups: Barman Cloud ObjectStore + ScheduledBackup ================= */}}
            {{- if $backupEnabled }}
            {{- $creds := $backup.s3Credentials }}
            ---
            apiVersion: barmancloud.cnpg.io/v1
            kind: ObjectStore
            metadata:
              name: {{ $objectStoreName }}
              namespace: {{ $namespace }}
              annotations:
                {{ setResourceNameAnnotation "objectstore" }}
                gotemplating.fn.crossplane.io/ready: {{ if index $observed "objectstore" }}"True"{{ else }}"False"{{ end }}
                # What the Project's inventory of its bucket (status.backup.servers)
                # records about this folder, and keeps after the cluster is gone.
                cnpg.cncp.nl/server-name: {{ $m.topology | quote }}
                cnpg.cncp.nl/postgres-version: {{ int ($spec.postgresVersion | default 17) | toString | quote }}
                cnpg.cncp.nl/database: {{ dig "name" "app" $db | quote }}
                cnpg.cncp.nl/database-owner: {{ dig "owner" "app" $db | quote }}
              labels:
                {{- range $k, $v := $labels }}
                {{ $k }}: {{ $v | quote }}
                {{- end }}
            spec:
              retentionPolicy: {{ dig "retentionPolicy" "30d" $backup | quote }}
              configuration:
                destinationPath: {{ $backup.destinationPath | quote }}
                {{- with $backup.endpointURL }}
                endpointURL: {{ . | quote }}
                {{- end }}
                {{- with $backup.endpointCA }}
                endpointCA:
                  name: {{ .secretName | quote }}
                  key: {{ .key | default "ca.crt" | quote }}
                {{- end }}
                s3Credentials:
                  accessKeyId:
                    name: {{ $creds.secretName | quote }}
                    key: {{ $creds.accessKeyIdKey | default "ACCESS_KEY_ID" | quote }}
                  secretAccessKey:
                    name: {{ $creds.secretName | quote }}
                    key: {{ $creds.secretAccessKeyKey | default "ACCESS_SECRET_KEY" | quote }}
                  {{- with $creds.regionKey }}
                  region:
                    name: {{ $creds.secretName | quote }}
                    key: {{ . | quote }}
                  {{- end }}
                wal:
                  compression: {{ dig "compression" "gzip" $backup }}
                  maxParallel: 2
                data:
                  compression: {{ dig "compression" "gzip" $backup }}
                  jobs: 2
            ---
            apiVersion: postgresql.cnpg.io/v1
            kind: ScheduledBackup
            metadata:
              name: {{ $name }}-scheduled
              namespace: {{ $namespace }}
              annotations:
                {{ setResourceNameAnnotation "scheduled-backup" }}
                gotemplating.fn.crossplane.io/ready: {{ if index $observed "scheduled-backup" }}"True"{{ else }}"False"{{ end }}
              labels:
                {{- range $k, $v := $labels }}
                {{ $k }}: {{ $v | quote }}
                {{- end }}
            spec:
              schedule: {{ dig "schedule" "0 0 2 * * *" $backup | quote }}
              # Take the first base backup right away: WAL archiving alone is
              # not restorable until a base backup exists.
              immediate: true
              backupOwnerReference: self
              method: plugin
              pluginConfiguration:
                name: barman-cloud.cloudnative-pg.io
              cluster:
                name: {{ $name }}
            {{- end }}

            {{- /* ================= Restore source: read-only ObjectStore ================= */}}
            {{- with $rs }}
            {{- $src := .store }}
            {{- $creds := $src.s3Credentials }}
            ---
            apiVersion: barmancloud.cnpg.io/v1
            kind: ObjectStore
            metadata:
              name: {{ $name }}-restore
              namespace: {{ $namespace }}
              annotations:
                {{ setResourceNameAnnotation "restore-objectstore" }}
                gotemplating.fn.crossplane.io/ready: {{ if index $observed "restore-objectstore" }}"True"{{ else }}"False"{{ end }}
              labels:
                {{- range $k, $v := $labels }}
                {{ $k }}: {{ $v | quote }}
                {{- end }}
            spec:
              # No retentionPolicy: the source's backups are only read, never
              # pruned through this store.
              configuration:
                destinationPath: {{ $src.destinationPath | quote }}
                {{- with $src.endpointURL }}
                endpointURL: {{ . | quote }}
                {{- end }}
                {{- with $src.endpointCA }}
                endpointCA:
                  name: {{ .secretName | quote }}
                  key: {{ .key | default "ca.crt" | quote }}
                {{- end }}
                s3Credentials:
                  accessKeyId:
                    name: {{ $creds.secretName | quote }}
                    key: {{ $creds.accessKeyIdKey | default "ACCESS_KEY_ID" | quote }}
                  secretAccessKey:
                    name: {{ $creds.secretName | quote }}
                    key: {{ $creds.secretAccessKeyKey | default "ACCESS_SECRET_KEY" | quote }}
                  {{- with $creds.regionKey }}
                  region:
                    name: {{ $creds.secretName | quote }}
                    key: {{ . | quote }}
                  {{- end }}
            {{- end }}

            {{- /* ================= Declarative databases ================= */}}
            {{- range $spec.databases }}
            {{- $key := printf "database-%s" (.name | replace "_" "-") }}
            {{- $dbObs := index $observed $key }}
            ---
            apiVersion: postgresql.cnpg.io/v1
            kind: Database
            metadata:
              name: {{ $name }}-{{ .name | replace "_" "-" }}
              namespace: {{ $namespace }}
              annotations:
                {{ setResourceNameAnnotation $key }}
                gotemplating.fn.crossplane.io/ready: {{ if and $dbObs (dig "resource" "status" "applied" false $dbObs) }}"True"{{ else }}"False"{{ end }}
              labels:
                {{- range $k, $v := $labels }}
                {{ $k }}: {{ $v | quote }}
                {{- end }}
            spec:
              cluster:
                name: {{ $name }}
              name: {{ .name | quote }}
              owner: {{ .owner | quote }}
              ensure: present
              databaseReclaimPolicy: {{ .reclaimPolicy | default "retain" }}
              {{- with .extensions }}
              extensions:
                {{- range . }}
                - name: {{ . | quote }}
                  ensure: present
                {{- end }}
              {{- end }}
            {{- end }}

            {{- /* ================= PgBouncer poolers ================= */}}
            {{- if $poolerEnabled }}
            {{- $poolerTypes := list "rw" }}
            {{- if dig "readOnly" false $pooler }}{{ $poolerTypes = append $poolerTypes "ro" }}{{ end }}
            {{- range $type := $poolerTypes }}
            ---
            apiVersion: postgresql.cnpg.io/v1
            kind: Pooler
            metadata:
              name: {{ $name }}-pooler-{{ $type }}
              namespace: {{ $namespace }}
              annotations:
                {{ setResourceNameAnnotation (printf "pooler-%s" $type) }}
                gotemplating.fn.crossplane.io/ready: {{ if index $observed (printf "pooler-%s" $type) }}"True"{{ else }}"False"{{ end }}
              labels:
                {{- range $k, $v := $labels }}
                {{ $k }}: {{ $v | quote }}
                {{- end }}
            spec:
              cluster:
                name: {{ $name }}
              instances: {{ int (dig "instances" 2 $pooler) }}
              type: {{ $type }}
              pgbouncer:
                poolMode: {{ dig "poolMode" "transaction" $pooler }}
                parameters:
                  max_client_conn: {{ dig "maxClientConn" 1000 $pooler | int | toString | quote }}
                  default_pool_size: {{ dig "defaultPoolSize" 25 $pooler | int | toString | quote }}
              template:
                metadata:
                  labels:
                    cnpg.cncp.nl/postgrescluster: {{ $name | quote }}
                    backstage.io/kubernetes-id: {{ $name | quote }}
                spec:
                  containers: []
                  affinity:
                    podAntiAffinity:
                      preferredDuringSchedulingIgnoredDuringExecution:
                        - weight: 100
                          podAffinityTerm:
                            topologyKey: kubernetes.io/hostname
                            labelSelector:
                              matchLabels:
                                cnpg.io/poolerName: {{ $name }}-pooler-{{ $type }}
            {{- end }}
            {{- end }}

            {{- /* ================= Prometheus metrics ================= */}}
            {{- if $monEnabled }}
            ---
            # Replaces the deprecated Cluster.spec.monitoring.enablePodMonitor:
            # scrapes the CNPG exporter (port "metrics", 9187) on every instance.
            apiVersion: monitoring.coreos.com/v1
            kind: PodMonitor
            metadata:
              name: {{ $name }}
              namespace: {{ $namespace }}
              annotations:
                {{ setResourceNameAnnotation "podmonitor" }}
                gotemplating.fn.crossplane.io/ready: {{ if index $observed "podmonitor" }}"True"{{ else }}"False"{{ end }}
              labels:
                {{- range $k, $v := merge (dict) $monLabels $labels }}
                {{ $k }}: {{ $v | quote }}
                {{- end }}
            spec:
              selector:
                matchLabels:
                  cnpg.io/cluster: {{ $name }}
                  cnpg.io/podRole: instance
              podMetricsEndpoints:
                - port: metrics
            {{- if $poolerEnabled }}
            ---
            # PgBouncer exporter (port "metrics", 9127) on every pooler pod.
            apiVersion: monitoring.coreos.com/v1
            kind: PodMonitor
            metadata:
              name: {{ $name }}-pooler
              namespace: {{ $namespace }}
              annotations:
                {{ setResourceNameAnnotation "podmonitor-pooler" }}
                gotemplating.fn.crossplane.io/ready: {{ if index $observed "podmonitor-pooler" }}"True"{{ else }}"False"{{ end }}
              labels:
                {{- range $k, $v := merge (dict) $monLabels $labels }}
                {{ $k }}: {{ $v | quote }}
                {{- end }}
            spec:
              selector:
                matchLabels:
                  cnpg.io/cluster: {{ $name }}
                  cnpg.io/podRole: pooler
              podMetricsEndpoints:
                - port: metrics
            {{- end }}
            {{- end }}

            {{- if $rulesEnabled }}
            ---
            apiVersion: monitoring.coreos.com/v1
            kind: PrometheusRule
            metadata:
              name: {{ $name }}-alerts
              namespace: {{ $namespace }}
              annotations:
                {{ setResourceNameAnnotation "prometheusrule" }}
                gotemplating.fn.crossplane.io/ready: {{ if index $observed "prometheusrule" }}"True"{{ else }}"False"{{ end }}
              labels:
                {{- range $k, $v := merge (dict) $monLabels $labels }}
                {{ $k }}: {{ $v | quote }}
                {{- end }}
            spec:
              groups:
                - name: cloudnative-pg/{{ $namespace }}/{{ $name }}
                  rules:
                    #@ALERT_RULES@
            {{- end }}

            {{- /* ================= Secrets a remote location needs =================
                 The S3 credentials, endpoint CA and role passwords live in the XR's
                 namespace on the control plane. The emitter turns these into
                 Objects that patch data/type from that Secret (provider-kubernetes
                 references), so the values never appear in the Object spec. */}}
            {{- $copies := list }}
            {{- if $backupEnabled }}
            {{- with $backup.s3Credentials }}{{ $copies = append $copies .secretName }}{{ end }}
            {{- with $backup.endpointCA }}{{ $copies = append $copies .secretName }}{{ end }}
            {{- end }}
            {{- with $rs }}
            {{- $copies = append $copies .store.s3Credentials.secretName }}
            {{- with .store.endpointCA }}{{ $copies = append $copies .secretName }}{{ end }}
            {{- end }}
            {{- range $spec.roles }}{{ with .passwordSecret }}{{ $copies = append $copies . }}{{ end }}{{ end }}
            {{- range $secret := $copies | uniq }}
            ---
            apiVersion: v1
            kind: Secret
            metadata:
              name: {{ $secret }}
              namespace: {{ $namespace }}
              annotations:
                {{ setResourceNameAnnotation (printf "secret-%s" $secret) }}
                gotemplating.fn.crossplane.io/ready: {{ if index $observed (printf "secret-%s" $secret) }}"True"{{ else }}"False"{{ end }}
                platform.cncp.nl/copy-from: {{ get $copyFrom $secret | default $secret }}
              labels:
                {{- range $k, $v := $labels }}
                {{ $k }}: {{ $v | quote }}
                {{- end }}
            {{- end }}
            {{- end }}

            {{- /* ================= top level ================= */}}
            {{- $xr := .observed.composite.resource }}
            {{- $spec := $xr.spec }}
            {{- $name := $xr.metadata.name }}
            {{- $namespace := $xr.metadata.namespace }}
            {{- $observed := .observed.resources | default (dict) }}
            {{- $instances := int ($spec.instances | default 3) }}
            {{- $pooler := $spec.pooler | default (dict) }}
            {{- $poolerEnabled := dig "enabled" false $pooler }}
            {{- $backup := $spec.backup | default (dict) }}
            {{- $backupEnabled := dig "enabled" false $backup }}
            {{- $mon := $spec.monitoring | default (dict) }}
            {{- $dashEnabled := dig "grafanaDashboard" "enabled" true $mon }}
            {{- $dashSelector := dig "grafanaDashboard" "instanceSelector" (dict) $mon }}
            {{- if not $dashSelector }}{{ $dashSelector = dict "dashboards.paas.cncp.nl/scope" $namespace }}{{ end }}
            {{- $dashUid := printf "cnpg-%s" (sha1sum (printf "%s/%s" $namespace $name) | trunc 20) }}
            {{- $labels := dict "app.kubernetes.io/managed-by" "crossplane" "app.kubernetes.io/part-of" "cnpg-platform" "cnpg.cncp.nl/postgrescluster" $name }}

            {{- /* ---- observed, normalised: an Object stands for the object it manages ---- */}}
            {{- $live := dict }}
            {{- range $k, $v := $observed }}
            {{- $r := $v.resource | default (dict) }}
            {{- if and (eq ($r.kind | default "") "Object") (hasPrefix "kubernetes.m.crossplane.io/" ($r.apiVersion | default "")) }}
            {{- with dig "status" "atProvider" "manifest" (dict) $r }}{{ $_ := set $live $k (dict "resource" .) }}{{ end }}
            {{- else }}
            {{- $_ := set $live $k $v }}
            {{- end }}
            {{- end }}

            {{- /* ---- sites: pinned in status.sites, else the Project's spec.locations ---- */}}
            ---
            apiVersion: meta.gotemplating.fn.crossplane.io/v1alpha1
            kind: ExtraResources
            requirements:
              project:
                apiVersion: platform.cncp.nl/v1alpha1
                kind: Project
                matchName: {{ $namespace }}
              sizes:
                apiVersion: apiextensions.crossplane.io/v1beta1
                kind: EnvironmentConfig
                matchName: postgres-sizes
            {{- $extra := .extraResources | default (dict) }}
            {{- $project := dict }}
            {{- with dig "project" "items" (list) $extra }}{{ $project = (first .).resource | default (dict) }}{{ end }}
            {{- $projectLocations := dig "spec" "locations" (dict) $project }}
            {{- $sites := dig "status" "sites" (dict) $xr }}
            {{- $protected := $sites.protected | default ($projectLocations.protected | default "") }}
            {{- $recovery := $sites.recovery | default ($projectLocations.recovery | default "") }}
            {{- $geo := $spec.geoReplication | default (dict) }}
            {{- $geoEnabled := dig "enabled" false $geo }}
            {{- $prevPrimary := dig "status" "primaryLocation" "" $xr }}
            {{- /* Geo replication switched off while the primary is in the recovery
                 site: keep the replica cluster and switch back first. */}}
            {{- $draining := and (not $geoEnabled) (ne $recovery "") (eq $prevPrimary $recovery) }}
            {{- $problem := "" }}
            {{- if not $protected }}
            {{- /* Never render an empty desired state over a running database. */}}
            {{- if and (hasKey $extra "project") (gt (len $observed) 1) }}{{ fail (printf "PostgresCluster %s/%s has composed resources but no site: neither status.sites nor Project %s says where it runs" $namespace $name $namespace) }}{{ end }}
            {{- $problem = printf "Namespace %s is not a Project with a protected location (Project spec.locations.protected)" $namespace }}
            {{- else if and $geoEnabled (not $recovery) }}
            {{- $problem = printf "geoReplication is enabled, but Project %s has no recovery location (spec.locations.recovery)" $namespace }}
            {{- end }}

            {{- /* ---- backup store: the cluster's own, or the Project's bucket (pinned in status.backupStore) ---- */}}
            {{- $specBackup := $spec.backup | default (dict) }}
            {{- $projectBucket := and (dig "enabled" false $specBackup) (not $specBackup.destinationPath) }}
            {{- $restore := $spec.restore | default (dict) }}
            {{- $restoreSrc := dig "source" (dict) $restore }}
            {{- $restoreFromProject := and $restore (not $restoreSrc.destinationPath) }}
            {{- $store := dict }}
            {{- if or $projectBucket $restoreFromProject }}
            {{- $store = dig "status" "backupStore" (dict) $xr }}
            {{- $pbs := dig "status" "backup" (dict) $project }}
            {{- if and (not $store.destinationPath) $pbs.ready $pbs.destinationPath }}
            {{- $store = dict "destinationPath" $pbs.destinationPath "endpointURL" ($pbs.endpoint | default "") "namespace" ($pbs.namespace | default $namespace) "region" (ne ($pbs.region | default "") "") }}
            {{- end }}
            {{- if not $store.destinationPath }}
            {{- /* Never drop WAL archiving from a running cluster. */}}
            {{- if and (hasKey $extra "project") (gt (len $observed) 1) }}{{ fail (printf "PostgresCluster %s/%s uses the Project's backup bucket, but neither status.backupStore nor Project %s status.backup says which" $namespace $name $namespace) }}{{ end }}
            {{- if not $problem }}{{ $problem = printf "%s the backup bucket of Project %s, which isn't ready (Project spec.backup and COSI)" (ternary "backup uses" "restore reads from" $projectBucket) $namespace }}{{ end }}
            {{- end }}
            {{- end }}

            {{- /* ---- sizing: spec.size from the postgres-sizes catalog, else spec.resources;
                 status.sizing (what the instances run with now) stands in while the
                 catalog can't say. ---- */}}
            {{- $sizeName := $spec.size | default "" }}
            {{- $pinnedSizing := dig "status" "sizing" (dict) $xr }}
            {{- $sizing := dict }}
            {{- if $sizeName }}
            {{- $catalog := list }}
            {{- with dig "sizes" "items" (list) $extra }}{{ $catalog = dig "resource" "data" "sizes" (list) (first .) }}{{ end }}
            {{- range $catalog }}
            {{- if eq (.name | default "") $sizeName }}{{ $sizing = dict "size" $sizeName "resources" (.resources | default (dict)) "parameters" (.parameters | default (dict)) }}{{ end }}
            {{- end }}
            {{- if not $sizing }}
            {{- if $pinnedSizing.resources }}
            {{- $sizing = $pinnedSizing }}
            {{- /* A size retired from the catalog is fine for the clusters that have it;
                 a change to one that isn't there is not applied. */}}
            {{- if and (hasKey $extra "sizes") (ne ($pinnedSizing.size | default "") $sizeName) (not $problem) }}{{ $problem = printf "size %s is not in the postgres-sizes catalog; the instances keep running as %s" $sizeName ($pinnedSizing.size | default "before") }}{{ end }}
            {{- else if gt (len $observed) 1 }}
            {{- /* Never resize a running database to the defaults. */}}
            {{- if hasKey $extra "sizes" }}{{ fail (printf "PostgresCluster %s/%s has size %s, which is not in the postgres-sizes catalog, and no status.sizing to keep running with" $namespace $name $sizeName) }}{{ end }}
            {{- else if not $problem }}
            {{- $problem = printf "size %s is not in the postgres-sizes catalog (EnvironmentConfig postgres-sizes, data.sizes)" $sizeName }}
            {{- end }}
            {{- end }}
            {{- else }}
            {{- $sizing = dict "size" "" "resources" ($spec.resources | default (dict)) "parameters" (dict) }}
            {{- end }}
            {{- /* The defaults, so status.sizing says what really runs. */}}
            {{- if $sizing }}
            {{- $r := $sizing.resources | default (dict) }}
            {{- $limits := dict "memory" (dig "limits" "memory" "1Gi" $r) }}
            {{- with dig "limits" "cpu" "" $r }}{{ $_ := set $limits "cpu" . }}{{ end }}
            {{- $sizing = dict "size" ($sizing.size | default "") "parameters" ($sizing.parameters | default (dict))
                  "resources" (dict "requests" (dict "cpu" (dig "requests" "cpu" "500m" $r) "memory" (dig "requests" "memory" "1Gi" $r)) "limits" $limits) }}
            {{- end }}

            {{- /* ---- archive folders: the cluster's name, or a new one for a restored
                 cluster (never the folder it restores from) ---- */}}
            {{- $server := $name }}
            {{- if $restore }}{{ $server = printf "%s-%s" $name (trunc 8 ($xr.metadata.uid | default "restored")) }}{{ end }}

            {{- /* ---- members: the protected site, then the recovery site ---- */}}
            {{- $location := $protected }}
            {{- $members := list }}
            {{- if and $protected $sizing (or (not (or $projectBucket $restoreFromProject)) $store.destinationPath) }}
            {{- $members = append $members (dict "location" $protected "site" "protected" "topology" $server "prefix" "" "original" true "instances" $instances "sizing" $sizing) }}
            {{- if and $recovery (or $geoEnabled $draining) }}
            {{- $members = append $members (dict "location" $recovery "site" "recovery" "topology" (printf "%s-%s" $server $recovery) "prefix" "recovery-" "original" false "instances" (int ($geo.instances | default $instances)) "sizing" $sizing) }}
            {{- end }}
            {{- end }}
            {{- $distributed := gt (len $members) 1 }}
            {{- $byLocation := dict }}
            {{- range $m := $members }}
            {{- $mobs := dict }}
            {{- range $k, $v := $live }}{{ if or (and $m.original (not (hasPrefix "recovery-" $k))) (and (not $m.original) (hasPrefix $m.prefix $k)) }}{{ $_ := set $mobs (trimPrefix $m.prefix $k) $v }}{{ end }}{{ end }}
            {{- $_ := set $m "observed" $mobs }}
            {{- $_ := set $m "cluster" (dig "cluster" "resource" (dict) $mobs) }}
            {{- $ready := false }}
            {{- range (dig "status" "conditions" (list) $m.cluster) }}
            {{- if and (eq .type "Ready") (eq .status "True") }}{{ $ready = true }}{{ end }}
            {{- end }}
            {{- $_ := set $m "ready" $ready }}
            {{- $_ := set $byLocation $m.location $m }}
            {{- end }}

            {{- range $m := $members }}
            {{- $secret := printf "%s-backup-s3" $name }}
            {{- $b := dict }}
            {{- if $store.destinationPath }}
            {{- $creds := dict "secretName" $secret }}
            {{- if eq $store.region true }}{{ $_ := set $creds "regionKey" "REGION" }}{{ end }}
            {{- $b = dict "destinationPath" $store.destinationPath "s3Credentials" $creds }}
            {{- with $store.endpointURL }}{{ $_ := set $b "endpointURL" . }}{{ end }}
            {{- if $projectBucket }}{{ $_ := set $m "backup" (merge (deepCopy $b) $specBackup) }}{{ end }}
            {{- $_ := set $m "copyFrom" (dict $secret (printf "%s/backup-s3-%s" $store.namespace $m.location)) }}
            {{- end }}
            {{- if and $restore $m.original }}
            {{- $_ := set $m "restore" (dict "store" (ternary $b (omit $restoreSrc "serverName") $restoreFromProject) "serverName" $restoreSrc.serverName "targetTime" ($restore.targetTime | default "")) }}
            {{- end }}
            {{- end }}

            {{- /* ---- which member is primary: target = where it should be, prev = where it was ---- */}}
            {{- $target := $location }}
            {{- if and (eq (dig "primarySite" "protected" $geo) "recovery") $geoEnabled (hasKey $byLocation $recovery) }}{{ $target = $recovery }}{{ end }}
            {{- $prev := dig "status" "primaryLocation" $location $xr }}
            {{- if not (hasKey $byLocation $prev) }}{{ $prev = $location }}{{ end }}
            {{- $targetM := get $byLocation $target }}
            {{- $prevM := get $byLocation $prev }}
            {{- $current := $target }}
            {{- $token := "" }}
            {{- $waiting := false }}
            {{- if eq $target $prev }}
            {{- /* Steady: keep the token the primary was promoted with. */}}
            {{- $token = dig "status" "promotionToken" "" $xr }}
            {{- else if ne (dig "promotion" "Switchover" $geo) "Failover" }}
            {{- /* Switchover: prev is demoted below; promote the target once prev
                 publishes a demotion token no member has been promoted with yet
                 (an old token from an earlier demotion would be refused). */}}
            {{- $demotion := dig "status" "demotionToken" "" $prevM.cluster }}
            {{- $used := list }}
            {{- range $members }}{{ with dig "status" "lastPromotionToken" "" .cluster }}{{ $used = append $used . }}{{ end }}{{ end }}
            {{- if and $demotion (not (has $demotion $used)) }}
            {{- $token = $demotion }}
            {{- else }}
            {{- $waiting = true }}
            {{- $current = $prev }}
            {{- end }}
            {{- end }}
            {{- range $m := $members }}
            {{- $primary := $targetM.topology }}
            {{- $source := $targetM.topology }}
            {{- if eq $m.location $target }}
            {{- if $waiting }}{{ $primary = $prevM.topology }}{{ end }}
            {{- /* A primary's source is only used once it is demoted. */}}
            {{- $source = $prevM.topology }}
            {{- if eq $target $prev }}
            {{- range $members }}{{ if and (ne .location $target) (eq $source $targetM.topology) }}{{ $source = .topology }}{{ end }}{{ end }}
            {{- end }}
            {{- end }}
            {{- $role := "replica" }}
            {{- if eq $m.location $current }}{{ $role = "primary" }}{{ else if and $waiting (eq $m.location $target) }}{{ $role = "promoting" }}{{ end }}
            {{- $_ := set $m "role" $role }}
            {{- $_ := set $m "replica" (dict "primary" $primary "source" $source "promotionToken" (ternary $token "" (and (eq $m.location $target) (not $waiting)))) }}
            {{- end }}
            {{- $primaryM := get $byLocation $current | default (dict "observed" (dict) "cluster" (dict) "instances" $instances "topology" $server) }}

            {{- /* ================= emit every member's objects ================= */}}
            {{- range $m := $members }}
            {{- $docs := include "member" (dict "xr" $xr "member" $m "members" $members "distributed" $distributed) }}
            {{- range $doc := splitList "\n---\n" (printf "\n%s" $docs) }}
            {{- $obj := fromYaml $doc }}
            {{- if and $obj (hasKey $obj "kind") }}
            {{- $ann := $obj.metadata.annotations }}
            {{- $key := printf "%s%s" $m.prefix (get $ann "gotemplating.fn.crossplane.io/composition-resource-name") }}
            {{- $ready := get $ann "gotemplating.fn.crossplane.io/ready" }}
            {{- $copyFrom := get $ann "platform.cncp.nl/copy-from" }}
            {{- range $a := list "gotemplating.fn.crossplane.io/composition-resource-name" "gotemplating.fn.crossplane.io/ready" "platform.cncp.nl/copy-from" }}{{ $_ := unset $ann $a }}{{ end }}
            {{- if not $ann }}{{ $_ := unset $obj.metadata "annotations" }}{{ end }}
            {{- /* The Project finds the backup folders in its bucket through this label. */}}
            {{- $objLabels := $labels }}
            {{- if eq $obj.kind "ObjectStore" }}{{ if hasKey $ann "cnpg.cncp.nl/server-name" }}{{ $objLabels = merge (dict "cnpg.cncp.nl/backup-store" "true") $labels }}{{ end }}{{ end }}
            ---
            apiVersion: kubernetes.m.crossplane.io/v1alpha1
            kind: Object
            metadata:
              name: {{ printf "%s-%s" $name $key }}
              namespace: {{ $namespace }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $key }}
                gotemplating.fn.crossplane.io/ready: {{ $ready | quote }}
                platform.cncp.nl/location: {{ $m.location }}
              labels:
                {{- range $k, $v := $objLabels }}
                {{ $k }}: {{ $v | quote }}
                {{- end }}
            spec:
              providerConfigRef:
                kind: ClusterProviderConfig
                name: {{ $m.location }}
              # Status changes (CNPG's Cluster.status) show up without waiting
              # for the poll interval; needs the provider's --enable-watches.
              watch: true
              {{- with $copyFrom }}
              {{- $from := splitList "/" $copyFrom }}
              references:
                {{- range $field := list "data" "type" }}
                - patchesFrom:
                    apiVersion: v1
                    kind: Secret
                    name: {{ last $from }}
                    namespace: {{ ternary (first $from) $namespace (eq (len $from) 2) }}
                    fieldPath: {{ $field }}
                {{- end }}
              {{- end }}
              forProvider:
                manifest:
                  {{- toYaml $obj | nindent 6 }}
            {{- end }}
            {{- end }}
            {{- end }}

            {{- /* ================= Grafana dashboard ================= */}}
            {{- if $dashEnabled }}
            ---
            apiVersion: grafana.integreatly.org/v1beta1
            kind: GrafanaDashboard
            metadata:
              name: {{ $name }}-cnpg
              namespace: {{ $namespace }}
              annotations:
                {{ setResourceNameAnnotation "dashboard" }}
                gotemplating.fn.crossplane.io/ready: {{ if index $observed "dashboard" }}"True"{{ else }}"False"{{ end }}
              labels:
                {{- range $k, $v := $labels }}
                {{ $k }}: {{ $v | quote }}
                {{- end }}
            spec:
              instanceSelector:
                matchLabels:
                  {{- range $k, $v := $dashSelector }}
                  {{ $k }}: {{ $v | quote }}
                  {{- end }}
              allowCrossNamespaceImport: {{ dig "grafanaDashboard" "allowCrossNamespaceImport" false $mon }}
              folder: {{ dig "grafanaDashboard" "folder" "CloudNativePG" $mon | quote }}
              # Unique per cluster (the upstream JSON hardcodes "cloudnative-pg",
              # which made every cluster's dashboard collide in one Grafana).
              uid: {{ $dashUid }}
              resyncPeriod: 10m
              datasources:
                - inputName: DS_PROMETHEUS
                  datasourceName: {{ dig "grafanaDashboard" "datasourceName" "prometheus" $mon | quote }}
              # CloudNativePG's official Grafana dashboard (Apache-2.0), same
              # JSON as cn-paas-operator-poc's internal/cnpg/dashboards, with
              # title/uid and the namespace/cluster variables preset to this
              # cluster by hack/generate.py.
              json: |
                #@DASHBOARD_JSON@
            {{- end }}

            {{- /* ================= XR status ================= */}}
            {{- $cstatus := dig "status" (dict) $primaryM.cluster }}
            {{- $clusterReady := not $problem }}
            {{- $notReady := list }}
            {{- range $members }}{{ if not .ready }}{{ $clusterReady = false }}{{ $notReady = append $notReady .location }}{{ end }}{{ end }}
            {{- $osObs := index $primaryM.observed "objectstore" }}
            {{- $window := dict }}
            {{- if $osObs }}{{ $window = dig "resource" "status" "serverRecoveryWindow" $primaryM.topology (dict) $osObs }}{{ end }}
            {{- $phase := dig "phase" "Provisioning" $cstatus }}
            {{- $ready := int (dig "readyInstances" 0 $cstatus) }}
            {{- $msg := printf "Waiting for CNPG Cluster %s (phase: %s, %d/%d instances ready)" $name $phase $ready (int $primaryM.instances) }}
            {{- if $clusterReady }}{{ $msg = printf "CNPG Cluster %s is ready (%d/%d instances)" $name $ready (int $primaryM.instances) }}{{ end }}
            {{- if $distributed }}
            {{- if $clusterReady }}{{ $msg = printf "CNPG Cluster %s is ready: primary in %s, %d replica cluster(s)" $name $current (sub (len $members) 1) }}
            {{- else }}{{ $msg = printf "Waiting for CNPG Cluster %s in %s" $name (join ", " $notReady) }}{{ end }}
            {{- if $waiting }}{{ $msg = printf "Switching the primary from %s to %s: waiting for the demotion token of %s" $prev $target $prev }}{{ end }}
            {{- if and $draining (not $waiting) }}{{ $msg = printf "geoReplication is off: switching the primary back to %s before removing the replica cluster in %s" $location $recovery }}{{ end }}
            {{- end }}
            {{- /* Until an instance is up, a restored cluster is still recovering. */}}
            {{- if and $restore (not $clusterReady) (eq $ready 0) $members }}
            {{- $msg = printf "Restoring %s from backup folder %s (%s); phase: %s" $name $restoreSrc.serverName (ternary (printf "up to %s" ($restore.targetTime | default "")) "latest state" (ne ($restore.targetTime | default "") "")) $phase }}
            {{- end }}
            {{- with $problem }}{{ $msg = . }}{{ end }}
            ---
            apiVersion: cnpg.cncp.nl/v1alpha1
            kind: PostgresCluster
            status:
              ready: {{ $clusterReady }}
              phase: {{ $phase | quote }}
              instances: {{ int (dig "instances" 0 $cstatus) }}
              readyInstances: {{ $ready }}
              currentPrimary: {{ dig "currentPrimary" "" $cstatus | quote }}
              image: {{ dig "image" "" $cstatus | quote }}
              message: {{ $msg | quote }}
              {{- if $store.destinationPath }}
              backupStore:
                {{- toYaml $store | nindent 16 }}
              {{- end }}
              {{- with $sizing }}
              sizing:
                {{- toYaml . | nindent 16 }}
              {{- end }}
              {{- if $protected }}
              sites:
                protected: {{ $protected }}
                {{- with $recovery }}
                recovery: {{ . }}
                {{- end }}
              primaryLocation: {{ $current }}
              primarySite: {{ ternary "recovery" "protected" (and (ne $recovery "") (eq $current $recovery)) }}
              {{- end }}
              {{- if $token }}
              promotionToken: {{ $token | quote }}
              {{- end }}
              locations:
                {{- if not $members }} []{{ end }}
                {{- range $members }}
                - location: {{ .location }}
                  site: {{ .site }}
                  role: {{ .role }}
                  ready: {{ .ready }}
                  phase: {{ dig "status" "phase" "Provisioning" .cluster | quote }}
                  instances: {{ int .instances }}
                  readyInstances: {{ int (dig "status" "readyInstances" 0 .cluster) }}
                  currentPrimary: {{ dig "status" "currentPrimary" "" .cluster | quote }}
                {{- end }}
              endpoints:
                readWrite: {{ printf "%s-rw.%s.svc" $name $namespace }}
                readOnly: {{ printf "%s-ro.%s.svc" $name $namespace }}
                read: {{ printf "%s-r.%s.svc" $name $namespace }}
                {{- if $poolerEnabled }}
                pooler: {{ printf "%s-pooler-rw.%s.svc" $name $namespace }}
                {{- if dig "readOnly" false $pooler }}
                poolerReadOnly: {{ printf "%s-pooler-ro.%s.svc" $name $namespace }}
                {{- end }}
                {{- end }}
              secrets:
                app: {{ $name }}-app
                {{- if $spec.enableSuperuserAccess }}
                superuser: {{ $name }}-superuser
                {{- end }}
              {{- if $backupEnabled }}
              backup:
                serverName: {{ $primaryM.topology | quote }}
                lastSuccessfulBackup: {{ dig "lastSuccessfulBackupTime" "" $window | quote }}
                firstRecoverabilityPoint: {{ dig "firstRecoverabilityPoint" "" $window | quote }}
              {{- end }}
              {{- if $dashEnabled }}
              monitoring:
                dashboardUid: {{ $dashUid }}
              {{- end }}
            ---
            # Custom condition next to Crossplane's own Ready/Synced (those
            # two types are reserved). Carries CNPG's view of health.
            apiVersion: meta.gotemplating.fn.crossplane.io/v1alpha1
            kind: ClaimConditions
            conditions:
              - type: PostgresReady
                status: {{ if $clusterReady }}"True"{{ else }}"False"{{ end }}
                reason: {{ if $clusterReady }}ClusterHealthy{{ else if $problem }}NoSite{{ else }}ClusterNotReady{{ end }}
                message: {{ $msg | quote }}
                target: Composite
