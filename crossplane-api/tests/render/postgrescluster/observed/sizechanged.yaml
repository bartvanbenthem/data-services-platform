apiVersion: kubernetes.m.crossplane.io/v1alpha1
kind: Object
metadata:
  name: orders-db-cluster
  namespace: demo
  annotations:
    crossplane.io/composition-resource-name: cluster
status:
  atProvider:
    manifest:
      apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      metadata:
        name: orders-db
        namespace: demo
      status:
        phase: Cluster in healthy state
        instances: 3
        readyInstances: 3
        currentPrimary: orders-db-1
        conditions:
        - type: Ready
          status: 'True'
          reason: ClusterIsReady
---
apiVersion: kubernetes.m.crossplane.io/v1alpha1
kind: Object
metadata:
  name: orders-db-podmonitor
  namespace: demo
  annotations:
    crossplane.io/composition-resource-name: podmonitor
status:
  atProvider:
    manifest:
      apiVersion: monitoring.coreos.com/v1
      kind: PodMonitor
      metadata:
        name: orders-db
        namespace: demo
---
apiVersion: kubernetes.m.crossplane.io/v1alpha1
kind: Object
metadata:
  name: orders-db-prometheusrule
  namespace: demo
  annotations:
    crossplane.io/composition-resource-name: prometheusrule
status:
  atProvider:
    manifest:
      apiVersion: monitoring.coreos.com/v1
      kind: PrometheusRule
      metadata:
        name: orders-db-alerts
        namespace: demo
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: orders-db-cnpg
  namespace: demo
  annotations:
    crossplane.io/composition-resource-name: dashboard
