# project-defaults with a COSI driver and access class, both Locations, and what COSI wrote for each
# BucketAccess (fake keys).
apiVersion: apiextensions.crossplane.io/v1beta1
kind: EnvironmentConfig
metadata:
  name: project-defaults
data:
  backup:
    cosi:
      driverName: cloudian-cosi-driver
      parameters:
        storagePolicy: replicated-3
      bucketAccessClassName: backups-keys
---
apiVersion: platform.cncp.nl/v1alpha1
kind: Location
metadata:
  name: si-ske-demo
spec:
  credentials:
    secretRef:
      namespace: cnpg-locations
      name: si-ske-demo
---
apiVersion: platform.cncp.nl/v1alpha1
kind: Location
metadata:
  name: onprem-ams
spec:
  credentials:
    secretRef:
      namespace: cnpg-locations
      name: onprem-ams
---
apiVersion: v1
kind: Secret
metadata:
  name: cosi-backups-si-ske-demo
  namespace: team-orders
data:
  BucketInfo: 
---
apiVersion: v1
kind: Secret
metadata:
  name: cosi-backups-onprem-ams
  namespace: team-orders
data:
  BucketInfo: 
