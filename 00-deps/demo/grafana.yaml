# Grafana for the demo namespace, run by grafana-operator (see ../README.md).
#
# The PostgresCluster composition creates a GrafanaDashboard per cluster with
# instanceSelector dashboards.paas.cncp.nl/scope=<namespace> and datasource
# "prometheus"; the label and datasource name below match those defaults.
apiVersion: grafana.integreatly.org/v1beta1
kind: Grafana
metadata:
  name: grafana
  namespace: demo
  labels:
    dashboards.paas.cncp.nl/scope: demo
spec:
  config:
    # The Backstage portal embeds the dashboards in an iframe.
    security:
      allow_embedding: "true"
    # Read-only anonymous access so the iframe works without a login.
    # Admin login: Secret grafana-admin-credentials.
    auth.anonymous:
      enabled: "true"
      org_role: Viewer
  ingress:
    spec:
      ingressClassName: haproxy
      rules:
        # nip.io resolves to the IP in the name: the HAProxy LoadBalancer IP
        # (kubectl get svc -n haproxy-ingress). Change it for another cluster.
        - host: grafana-demo.188.34.124.213.nip.io
          http:
            paths:
              - path: /
                pathType: Prefix
                backend:
                  service:
                    name: grafana-service
                    port:
                      number: 3000
        - host: grafana.paas.cncp.nl
          http:
            paths:
              - path: /
                pathType: Prefix
                backend:
                  service:
                    name: grafana-service
                    port:
                      number: 3000
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: prometheus
  namespace: demo
spec:
  instanceSelector:
    matchLabels:
      dashboards.paas.cncp.nl/scope: demo
  datasource:
    name: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus-operated.demo.svc:9090
    isDefault: true
