# Cluster-wide Project settings for this cluster (see
# ../../02-crossplane-api/examples/project-defaults.yaml for every key).
apiVersion: apiextensions.crossplane.io/v1beta1
kind: EnvironmentConfig
metadata:
  name: project-defaults
data:
  grafana:
    ingress:
      className: haproxy
      # nip.io resolves to the IP in the name: the HAProxy LoadBalancer IP
      # (kubectl get svc -n haproxy-ingress). Change it for another cluster.
      hostTemplate: grafana-{project}.188.34.124.213.nip.io
  prometheus:
    # The locations' Prometheus send their samples here, through this
    # cluster's ingress (the same HAProxy IP).
    remoteWrite:
      hostTemplate: prometheus-{project}.188.34.124.213.nip.io
      scheme: http
      className: haproxy
    # These describe the locations (where kube-prometheus-stack runs there).
    clusterMetrics:
      namespace: prometheus-operator-system
      serviceMonitorLabels:
        release: prometheus-operator
  # A COSI backup bucket per Project (Cloudian HyperStore, installed by
  # ../cosi/deploy-cosi-crds-driver.sh): PostgresClusters with backups and no
  # destination of their own archive there. Each Project gets its own
  # BucketClass (deletionPolicy Retain) and keys per location; the IAM access
  # class still hands out S3 keys in COSI's BucketInfo Secret.
  backup:
    cosi:
      driverName: cloudian-cosi-driver
      bucketAccessClassName: cosi-test-bucketaccessclass
